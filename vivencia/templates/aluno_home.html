<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Vivência</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --teal:   #1f8a93;
            --navy:   #423c5c;
            --ink:    #2b2740;
            --muted:  #6b7280;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        /* ===== Foto real da fachada como fundo full-bleed ===== */
        .bg-photo {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image: url("/media/fachada.jpg");
            background-size: cover;
            background-position: center;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(150deg, rgba(43,39,64,0.92) 0%, rgba(31,138,147,0.55) 55%, rgba(66,60,92,0.88) 100%);
        }

        .page {
            display: flex;
            min-height: 100vh;
        }

        /* ===== Trilha real com a imagem das flags ===== */
        .brand-rail {
            width: clamp(64px, 8vw, 120px);
            flex-shrink: 0;
            overflow: hidden;
        }

        .brand-rail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: right center;
            display: block;
        }

        /* ===== Área central com o card ===== */
        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        .eyebrow {
            position: absolute;
            top: 36px;
            left: 36px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-size: 11.5px;
            font-weight: 600;
            opacity: 0.85;
        }

        .eyebrow .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--teal);
        }

        /* ===== Card com efeito glass sobre a foto ===== */
        .card {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(6px);
            border-radius: 22px;
            box-shadow: 0 25px 60px rgba(10, 8, 25, 0.35);
            padding: 38px 32px 32px;
            text-align: center;
            color: var(--ink);
        }

        .avatar {
            width: 62px;
            height: 62px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--navy), var(--teal));
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 5px rgba(31, 138, 147, 0.15);
        }

        .card h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card p.subtitle {
            color: var(--muted);
            font-size: 13.5px;
            margin-bottom: 22px;
        }

        .clock {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: #f6f5fa;
            border: 1px solid #ebe9f2;
            border-radius: 14px;
            padding: 12px 26px;
            margin-bottom: 26px;
        }

        .clock-time {
            font-family: 'Poppins', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--navy);
            font-variant-numeric: tabular-nums;
        }

        .clock-date {
            font-size: 12px;
            color: var(--muted);
            text-transform: capitalize;
        }

        .btn-ponto {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--teal), var(--navy));
            color: #fff;
            text-decoration: none;
            border-radius: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 15.5px;
            font-weight: 600;
            box-shadow: 0 10px 24px rgba(31, 138, 147, 0.35);
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .btn-ponto svg { width: 19px; height: 19px; }

        .btn-ponto::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 14px;
            border: 2px solid var(--teal);
            opacity: 0.6;
            animation: pulse-ring 2.2s ease-out infinite;
        }

        .btn-ponto:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(31,138,147,0.45); }
        .btn-ponto:active { transform: translateY(0) scale(0.98); }

        @keyframes pulse-ring {
            0%   { transform: scale(1); opacity: 0.55; }
            80%  { transform: scale(1.08); opacity: 0; }
            100% { transform: scale(1.08); opacity: 0; }
        }

        .footer-tag {
            margin-top: 20px;
            font-size: 11.5px;
            color: var(--muted);
        }

        @media (max-width: 640px) {
            .brand-rail { display: none; }
            .eyebrow { left: 24px; top: 24px; }
        }
    </style>
</head>
<body>

    <div class="bg-photo"></div>
    <div class="bg-overlay"></div>

    <div class="eyebrow"><span class="dot"></span> Instituto JCA · Programa Vivência</div>

    <div class="page">

        <main class="content">
            <div class="card">

                <div class="avatar">{{ request.user.first_name|default:request.user.username|first|upper }}</div>

                <h1>Olá, {{ request.user.first_name|default:request.user.username }}</h1>
                <p class="subtitle">Bem-vindo à sua área do aluno</p>

                <div class="clock" id="liveClock">
                    <span class="clock-time">--:--:--</span>
                    <span class="clock-date">carregando...</span>
                </div>

                <a href="{% url 'bater_ponto' %}" class="btn-ponto">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"></circle>
                        <polyline points="12 7 12 12 15.5 14"></polyline>
                    </svg>
                    Bater Ponto
                </a>

                <p class="footer-tag">Instituto JCA · Programa Vivência</p>
            </div>
        </main>

        <aside class="brand-rail">
            <img src="/media/1.png" alt="">
        </aside>

    </div>

    <script>
        function atualizarRelogio() {
            const el = document.getElementById('liveClock');
            if (!el) return;
            const agora = new Date();
            el.querySelector('.clock-time').textContent = agora.toLocaleTimeString('pt-BR');
            el.querySelector('.clock-date').textContent = agora.toLocaleDateString('pt-BR', {
                weekday: 'long', day: '2-digit', month: 'long'
            });
        }
        atualizarRelogio();
        setInterval(atualizarRelogio, 1000);
    </script>

</body>
</html>
