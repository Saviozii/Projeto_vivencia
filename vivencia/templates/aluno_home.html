<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Vivência</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 36px 28px;
            text-align: center;
        }

        .card h1 {
            color: #1f2937;
            font-size: 22px;
            margin-bottom: 6px;
        }

        .card p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .btn-ponto {
            display: block;
            width: 100%;
            padding: 16px;
            background: #4f46e5;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-ponto:hover {
            background: #4338ca;
        }

        .btn-ponto:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Olá, {{ request.user.first_name|default:request.user.username }}</h1>
        <p>Bem-vindo à sua área do aluno</p>

        <a href="{% url 'bater_ponto' %}" class="btn-ponto">Bater Ponto</a>
    </div>
</body>
</html>
